name: 'Cross-Platform E2E Tests'

on:
    push:
        branches:
            - master
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '.plans/**'
            - '.agents/**'
            - '.codex/**'
            - '.claude/**'
            - 'apps/website/**'
    workflow_call:
        inputs:
            cross_platform:
                description: 'Run macOS/Windows Electron shards and Windows hosted-server smoke in addition to Ubuntu'
                type: boolean
                required: false
                default: true
    workflow_dispatch:
        inputs:
            cross_platform:
                description: 'Run macOS/Windows Electron shards and Windows hosted-server smoke in addition to Ubuntu'
                type: boolean
                required: false
                default: true

# CI calls PR E2E only after fast validation. Its group must differ from the
# caller: github.workflow is inherited by reusable workflows.
# Superseded PR pushes cancel their still-running E2E matrix (the most
# expensive per-PR runner time). Non-PR runs get a unique group (run_id):
# GitHub keeps at most one pending run per group even with
# cancel-in-progress: false, so a shared ref group could silently drop a
# queued master run between two rapid pushes.
concurrency:
    group: e2e-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    # Builds the platform-independent Electron E2E JS/renderer/worker assets
    # once and resolves the OS shard matrix so each shard downloads `dist/`
    # instead of rebuilding 10 Nx targets from scratch.
    build-electron-e2e:
        name: Build Electron E2E bundle
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            cross-platform: ${{ steps.plan.outputs.cross-platform }}
        env:
            CI: true
            NX_SKIP_NX_CACHE: true
            NX_TASKS_RUNNER_DYNAMIC_OUTPUT: false

        steps:
            - name: Resolve Electron E2E matrix
              id: plan
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_CROSS_PLATFORM: ${{ inputs.cross_platform }}
              run: |
                  set -euo pipefail
                  if [ "${EVENT_NAME}" = "push" ] || [ "${INPUT_CROSS_PLATFORM}" = "true" ]; then
                      cross_platform="true"
                      matrix='{"include":[{"os":"ubuntu-latest","shard":1,"shard-total":3},{"os":"ubuntu-latest","shard":2,"shard-total":3},{"os":"ubuntu-latest","shard":3,"shard-total":3},{"os":"macos-latest","shard":1,"shard-total":2},{"os":"macos-latest","shard":2,"shard-total":2},{"os":"windows-latest","shard":1,"shard-total":4},{"os":"windows-latest","shard":2,"shard-total":4},{"os":"windows-latest","shard":3,"shard-total":4},{"os":"windows-latest","shard":4,"shard-total":4}]}'
                  else
                      cross_platform="false"
                      matrix='{"include":[{"os":"ubuntu-latest","shard":1,"shard-total":3},{"os":"ubuntu-latest","shard":2,"shard-total":3},{"os":"ubuntu-latest","shard":3,"shard-total":3}]}'
                  fi
                  echo "cross-platform=${cross_platform}" >> "$GITHUB_OUTPUT"
                  echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Electron E2E assets
              run: pnpm nx run electron-backend:build-e2e

            - name: Verify Electron E2E bundle
              run: |
                  test -f dist/apps/electron-backend/main.js
                  test -f dist/apps/web/index.html
                  test -d dist/apps/remote-control-web

            - name: Upload Electron E2E bundle
              uses: actions/upload-artifact@v7
              with:
                  name: electron-e2e-build
                  path: |
                      dist/apps/electron-backend/
                      dist/apps/web/
                      dist/apps/remote-control-web/
                      dist/libs/
                  if-no-files-found: error
                  retention-days: 1

    electron-e2e-tests:
        name: Electron E2E on ${{ matrix.os }} (${{ matrix.shard }}/${{ matrix.shard-total }})
        needs: build-electron-e2e
        runs-on: ${{ matrix.os }}
        # The sequential Electron suite is split into Playwright shards (one
        # runner each, split by spec file). Windows uses four shards: with
        # three, different shards reached the 30-minute job limit on slower
        # runners, including setup, without test failures. Linux uses three.
        # macOS uses two shards because its runners are the scarcest:
        # three macOS shards per run queued for 45-57 minutes on master.
        # A passing macOS shard took 46 minutes before setup/build/artifact time.
        # Reserve 60 minutes for the complete job, including report upload.
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 30 }}
        env:
            IPTVNATOR_ALLOW_PRIVATE_NETWORK_URLS: '1'
            NX_SKIP_NX_CACHE: true
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.build-electron-e2e.outputs.matrix) }}

        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Download Electron E2E bundle
              uses: actions/download-artifact@v8
              with:
                  name: electron-e2e-build
                  path: dist

            - name: Verify downloaded Electron E2E bundle
              run: |
                  node -e "const fs = require('node:fs'); for (const p of ['dist/apps/electron-backend/main.js', 'dist/apps/web/index.html', 'dist/apps/remote-control-web']) { if (!fs.existsSync(p)) throw new Error('Missing prebuilt E2E output: ' + p); }"

            # The suite drives Electron through Playwright's _electron API and
            # never launches a Playwright browser (or records video, which
            # would need Playwright's ffmpeg), so no `playwright install`.
            # The Ubuntu runner image already ships Electron's shared
            # libraries and xvfb; check them before executing the binary.
            - name: Check Electron runtime dependencies
              if: runner.os == 'Linux'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  command -v xvfb-run || { echo "::error::xvfb-run is missing on the runner"; exit 1; }
                  node tools/testing/electron/ensure-electron-binary.mjs --download-only
                  electron_bin="$(node -p "require('electron')")"
                  [ -x "$electron_bin" ] || { echo "::error::Electron binary not found at $electron_bin"; exit 1; }
                  ldd_status=0
                  libs="$(ldd "$electron_bin")" || ldd_status=$?
                  missing="$(grep 'not found' <<< "$libs" || true)"
                  if [ -n "$missing" ]; then
                      echo "::error::Electron is missing shared libraries:"
                      echo "$missing"
                      exit 1
                  fi
                  [ "$ldd_status" -eq 0 ] || { echo "::error::ldd failed on $electron_bin (exit $ldd_status)"; exit 1; }

            - name: Prepare Electron binary
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node tools/testing/electron/ensure-electron-binary.mjs

            # Window-selection and process-lifecycle checks are independent of the shard split;
            # run them once per OS.
            - name: Verify Electron window readiness and process cleanup
              if: matrix.shard == 1
              run: pnpm exec tsx --test apps/electron-backend-e2e/src/performance/electron-main-window.spec.ts apps/electron-backend-e2e/src/performance/electron-process-lifecycle.spec.ts apps/electron-backend-e2e/src/performance/electron-process-termination.spec.ts

            - name: Run Electron E2E Tests (Linux)
              if: runner.os == 'Linux'
              run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm exec playwright test --config=apps/electron-backend-e2e/playwright.config.ts --shard=${{ matrix.shard }}/${{ matrix.shard-total }}
              env:
                  CI: true

            - name: Run Electron E2E Tests (Windows/Mac)
              if: runner.os != 'Linux'
              run: pnpm exec playwright test --config=apps/electron-backend-e2e/playwright.config.ts --shard=${{ matrix.shard }}/${{ matrix.shard-total }}
              env:
                  CI: true

            # Each shard's results.json carries config.shard; the summary job
            # below merges the shards of one OS into a single semantic summary.
            - name: Upload Electron Test Results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-electron-${{ matrix.os }}-${{ matrix.shard }}
                  path: |
                      dist/playwright-report/electron-backend-e2e/
                      dist/test-results/electron-backend-e2e/
                  retention-days: 7

    hosted-server-smoke:
        name: Hosted server smoke on Windows
        needs: build-electron-e2e
        if: >-
            ${{ !cancelled() &&
                needs.build-electron-e2e.result == 'success' &&
                needs.build-electron-e2e.outputs.cross-platform == 'true' }}
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            CI: true
            NX_SKIP_NX_CACHE: true
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare Electron binary
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node tools/testing/electron/ensure-electron-binary.mjs

            - name: Install Playwright Chromium
              run: pnpm exec playwright install chromium

            - name: Run hosted server smoke
              run: pnpm nx run electron-backend-e2e:hosted-server

            - name: Upload hosted server test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-hosted-server-windows
                  path: |
                      dist/playwright-report/electron-backend-e2e/
                      dist/test-results/electron-backend-e2e/
                  retention-days: 7

    # The self-hosted source-sync specs (including profiles-ipc) skip
    # themselves unless their own config sets IPTVNATOR_E2E_SOURCE_SYNC, so
    # the sharded run above never runs them. They need their own mock
    # servers and web server, so they get one Ubuntu job.
    electron-source-sync-e2e:
        name: Electron source-sync E2E on Ubuntu
        needs: build-electron-e2e
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            IPTVNATOR_ALLOW_PRIVATE_NETWORK_URLS: '1'
            NX_SKIP_NX_CACHE: true

        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Download Electron E2E bundle
              uses: actions/download-artifact@v8
              with:
                  name: electron-e2e-build
                  path: dist

            - name: Prepare Electron binary
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node tools/testing/electron/ensure-electron-binary.mjs

            # history-sync.e2e.ts drives a Playwright browser next to Electron.
            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run source-sync E2E Tests
              run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm exec playwright test --config=apps/electron-backend-e2e/playwright.source-sync.config.ts
              env:
                  CI: true

            - name: Upload source-sync test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-electron-source-sync
                  path: |
                      dist/playwright-report/electron-backend-e2e/
                      dist/test-results/electron-backend-e2e/
                  retention-days: 7

    electron-e2e-summary:
        name: Electron E2E summary
        runs-on: ubuntu-latest
        needs: [build-electron-e2e, electron-e2e-tests]
        # Summarize failed shards too, but not a cancelled run or a failed build.
        if: ${{ !cancelled() && needs.build-electron-e2e.result == 'success' }}
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            # One download per OS keeps each OS's shards in their own directory
            # (the artifact paths inside the shards are identical).
            - name: Download shard reports (Ubuntu)
              uses: actions/download-artifact@v8
              with:
                  pattern: playwright-report-electron-ubuntu-latest-*
                  path: dist/e2e-shards/ubuntu-latest

            - name: Download shard reports (macOS)
              if: needs.build-electron-e2e.outputs.cross-platform == 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: playwright-report-electron-macos-latest-*
                  path: dist/e2e-shards/macos-latest

            - name: Download shard reports (Windows)
              if: needs.build-electron-e2e.outputs.cross-platform == 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: playwright-report-electron-windows-latest-*
                  path: dist/e2e-shards/windows-latest

            # The script fails when a shard's results.json is missing or
            # duplicated, so a partial run is never summarized as complete.
            - name: Summarize Electron E2E semantic coverage per OS
              env:
                  CROSS_PLATFORM: ${{ needs.build-electron-e2e.outputs.cross-platform }}
              run: |
                  set -euo pipefail
                  oses=(ubuntu-latest)
                  if [ "${CROSS_PLATFORM}" = "true" ]; then
                      oses+=(macos-latest windows-latest)
                  fi
                  status=0
                  for os in "${oses[@]}"; do
                      echo "## Electron E2E on $os" >> "$GITHUB_STEP_SUMMARY"
                      node tools/coverage/e2e-semantic-summary.mjs --project=electron-backend-e2e --input="dist/e2e-shards/$os" --output-dir="coverage/e2e/$os" || status=1
                  done
                  exit "$status"

            - name: Upload Electron semantic summaries
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-semantic-summary-electron
                  path: coverage/e2e/
                  retention-days: 7

    web-e2e-tests:
        name: Web E2E on Ubuntu Chromium (${{ matrix.shard }}/3)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            NX_SKIP_NX_CACHE: true
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]

        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Install fonts for vertical CJK text
              run: sudo apt-get install -y fonts-noto-cjk

            - name: Run Web E2E Tests
              run: pnpm nx run web-e2e:e2e -- --project=chromium --workers=2 --shard=${{ matrix.shard }}/3
              env:
                  CI: true

            # Production PWA update recovery runs its own standalone config and
            # does not shard; run it once on shard 1 and keep its unsharded
            # results.json in a separate artifact so web-e2e-summary merges
            # only the three sharded web-e2e reports.
            - name: Run production PWA update recovery
              if: matrix.shard == 1
              run: pnpm nx run web-e2e:pwa-updates

            - name: Upload Web Test Results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-web-ubuntu-${{ matrix.shard }}
                  path: |
                      dist/playwright-report/web-e2e/
                      dist/test-results/web-e2e/
                  retention-days: 7

            - name: Upload PWA update recovery results
              if: always() && matrix.shard == 1
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-pwa-updates-ubuntu
                  path: dist/test-results/pwa-updates/
                  if-no-files-found: ignore
                  retention-days: 7

    web-e2e-summary:
        name: Web E2E summary
        runs-on: ubuntu-latest
        needs: web-e2e-tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Download Web E2E shard reports
              uses: actions/download-artifact@v8
              with:
                  pattern: playwright-report-web-ubuntu-*
                  path: dist/e2e-shards/web-e2e

            - name: Summarize Web E2E semantic coverage
              run: node tools/coverage/e2e-semantic-summary.mjs --project=web-e2e --input=dist/e2e-shards/web-e2e --output-dir=coverage/e2e/web-e2e

            - name: Upload Web semantic summary
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-semantic-summary-web
                  path: coverage/e2e/web-e2e/
                  retention-days: 7
