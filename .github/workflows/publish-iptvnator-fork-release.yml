name: Publish verified IPTVnator Windows preview

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-iptvnator-epgpriority-6
  cancel-in-progress: false

jobs:
  publish-and-clean:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.25.0-epgpriority.6
    steps:
      - name: Download previously verified Windows x64 installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 40133636976 --repo "$GH_REPO" --name IPTVnator-M3U-Per-Channel-Exact-v0.25.0-epgpriority.6-Windows-x64 --dir release-assets
          mapfile -d '' -t installers < <(find release-assets -type f -name '*windows-x64-setup.exe' -print0)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one installer, found ${#installers[@]}" >&2
            exit 1
          fi
          echo "SETUP_EXE=${installers[0]}" >> "$GITHUB_ENV"
          echo '## Verified Windows installer' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "${installers[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public GitHub pre-release and attach EXE
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## IPTVnator community fork v0.25.0-epgpriority.6

          **Windows x64 (unsigned NSIS installer).** Community preview; not endorsed by upstream IPTVnator.

          ### Changes
          - Exact channel-name matching is the default first XMLTV lookup, followed by tvg-name and tvg-id (configurable).
          - M3U entries that reuse a provider tvg-id (e.g. A2 HD/UHD and BEINSPORTS 1 HD/SD) now resolve EPG independently.
          - First Exact Match for repeated XMLTV channel display names; saved manual mappings take precedence.
          - M3U Live TV / Movies / Series / Unclassified navigation for large mixed playlists.
          - Xtream externally configured XMLTV source preference and initial-list EPG refresh improvements.
          - Batched SQLite lookup for saved manual associations.

          ### Validation and safety
          - Automated Windows CI tests, typechecks, native MPV staging, installer build and artifact upload passed.
          - Real Windows preview confirmed BEINSPORTS 1 HD EPG and populated timeline with external XMLTV.
          - IPTV playlists, XMLTV guides, favorites and manual mappings remain unchanged.
          - Installer is **unsigned**; Windows may display a SmartScreen warning.

          Source: https://github.com/mkaand/iptvnator/tree/master
          CI: https://github.com/mkaand/iptvnator/actions/runs/40133636976
          This software provides no IPTV channels, streams, or subscriptions.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving it."
          else
            gh release create "$RELEASE_TAG" "$SETUP_EXE" --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'IPTVnator 0.25.0-epgpriority.6 | Windows x64' --notes-file release-notes.md --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,assets --jq '{url: .url, assets: [.assets[].name]}' >> "$GITHUB_STEP_SUMMARY"

      - name: Archive unique experimental branch history
        shell: bash
        run: |
          set -euo pipefail
          old_branch='fix/m3u-epg-colliding-tvg-ids'
          old_sha='72c9bc409ef685f8b0622f9e6a2de40a60985706'
          archive='archive/m3u-epg-colliding-tvg-ids-20261025'
          current=$(gh api "repos/$GH_REPO/git/ref/heads/$old_branch" --jq '.object.sha')
          if [[ "$current" != "$old_sha" ]]; then
            echo "Ref changed, refusing to archive or delete $old_branch: $current" >&2
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/$archive" >/dev/null 2>&1; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$archive" -f sha="$old_sha" >/dev/null
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$archive" --jq '.object.sha')" = "$old_sha"
          echo "Archived $old_branch as tag $archive" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove obsolete feature branches after successful release
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'feat/epg-configurable-match-priority'
            'feat/epg-duplicate-candidate-diagnostics'
            'feat/epg-duplicate-coverage-and-fork-readme'
            'feat/epg-first-exact-match'
            'feat/m3u-content-classification'
            'fix/epg-exact-name-fallback'
            'fix/m3u-epg-alias-reactive-refresh'
            'fix/m3u-epg-colliding-tvg-ids'
            'fix/m3u-epg-per-channel-exact'
            'fix/xtream-epg-visible-list-initial-refresh'
          )
          echo '## Branch cleanup' >> "$GITHUB_STEP_SUMMARY"
          for branch in "${branches[@]}"; do
            if ! head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null); then
              echo "Already absent: $branch" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            ahead=$(gh api "repos/$GH_REPO/compare/master...$branch" --jq '.ahead_by')
            if [[ "$ahead" != '0' ]]; then
              if [[ "$branch" != 'fix/m3u-epg-colliding-tvg-ids' || "$head_sha" != '72c9bc409ef685f8b0622f9e6a2de40a60985706' ]]; then
                echo "Keeping unmerged/changed branch: $branch (ahead=$ahead)" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              archived_sha=$(gh api "repos/$GH_REPO/git/ref/tags/archive/m3u-epg-colliding-tvg-ids-20261025" --jq '.object.sha')
              if [[ "$archived_sha" != "$head_sha" ]]; then
                echo "Keeping $branch: archive SHA mismatch" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted: $branch" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'Default master is never deleted.' >> "$GITHUB_STEP_SUMMARY"
