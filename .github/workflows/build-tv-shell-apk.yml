name: Build TV shell APK

# Builds the IPTVnator PWA from this repository, bundles it into the Fire TV /
# Android TV shell (tv-shell/), runs the shell's backend tests and publishes the
# APK as a workflow artifact and, on manual dispatch with `create_release`
# ticked, as a GitHub release.
# By default that release is a pre-release never marked "Latest": in the
# IPTVnator repository a Latest release without the desktop updater's
# latest*.yml would break auto-update and the website download resolver (see
# docs/architecture/release-pipeline.md). Forks can untick `prerelease`.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish the APK as a GitHub release"
        type: boolean
        default: false
      prerelease:
        description: "Mark it as a pre-release, never Latest (keep this on in the IPTVnator repository itself)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "tv-shell/**"
      - ".github/workflows/build-tv-shell-apk.yml"
      # a parser upgrade must regenerate the Java port's fixtures
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [master]
    paths:
      - "tv-shell/**"
      - ".github/workflows/build-tv-shell-apk.yml"
      - "package.json"
      - "pnpm-lock.yaml"

# Superseded PR pushes cancel their still-running build; master and manual runs
# get a unique group (run_id), the same pattern as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build job only reads the repository; the release job raises itself to
# contents: write at the job level.
permissions:
  contents: read

env:
  SHELL_DIR: tv-shell

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      apk_version: ${{ steps.apk.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # pnpm version from the packageManager field, as in ci.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Java M3U parser port is checked against fixtures generated by the
      # parser the PWA ships; a parser upgrade must regenerate them.
      - name: Parser fixtures match the parser the PWA ships
        shell: bash
        run: |
          set -euo pipefail
          node "$SHELL_DIR/tools/gen-parser-fixtures.mjs"
          FIXTURES="$SHELL_DIR/android/backend/src/test/resources/m3u-fixtures"
          if [ -n "$(git status --porcelain --untracked-files=all -- "$FIXTURES")" ]; then
            git --no-pager diff -- "$FIXTURES"
            git status --short -- "$FIXTURES"
            echo "::error::m3u-fixtures differ from the installed iptv-playlist-parser: run node tv-shell/tools/gen-parser-fixtures.mjs, commit, and make the Java port follow (./gradlew :backend:check)"
            exit 1
          fi

      - name: Build the PWA (same configuration as the Docker image)
        shell: bash
        env:
          NX_TASKS_RUNNER_DYNAMIC_OUTPUT: false
          # Settings > About shows "<version> (<sha>)" like the Docker and desktop
          # builds; on a PR the head SHA, not the ephemeral merge commit.
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node tools/build/inject-build-commit.mjs
          pnpm nx build web --configuration=pwa --skip-nx-cache
          test -f dist/apps/web/index.html

      - name: Bundle the PWA into the shell
        shell: bash
        run: |
          set -euo pipefail
          "$SHELL_DIR/scripts/bundle-pwa.sh" dist/apps/web

      # The two remote-control suites drive the PWA just built, served by the
      # Node twin of the loopback server, with nothing but remote keys.
      - name: Install Chromium for the remote-control suites
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Remote-control suites (tv.js against the real PWA)
        shell: bash
        env:
          WWW: ${{ github.workspace }}/dist/apps/web
          SHOTS: ${{ runner.temp }}/tv-shell-shots
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/devserver.log"
          "$SHELL_DIR/devserver/run-dev.sh" > "$LOG" 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            # Any answer from the mock provider will do; the dev server must serve the PWA.
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:43330/ \
                && curl -sS -o /dev/null --max-time 2 http://127.0.0.1:43331/player_api.php; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::the dev server or the mock provider did not start"
            cat "$LOG"
            exit 1
          fi
          # Both suites always run; the dev server log is printed when either fails.
          status=0
          node "$SHELL_DIR/tests/tv-remote.mjs" --shots "$SHOTS/remote" || status=1
          node "$SHELL_DIR/tests/tv-longlist.mjs" --shots "$SHOTS/longlist" || status=1
          if [ "$status" != 0 ]; then
            echo "--- dev server log"
            cat "$LOG"
          fi
          exit "$status"

      - name: Upload the suites' screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tv-shell-remote-control-shots
          path: ${{ runner.temp }}/tv-shell-shots
          if-no-files-found: ignore

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches ~/.gradle and validates gradle/wrapper/gradle-wrapper.jar against
      # Gradle's published checksums (the wrapper jar is a committed binary).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Backend tests (parser fixtures, routes)
        shell: bash
        working-directory: ${{ env.SHELL_DIR }}/android
        run: ./gradlew --no-daemon :backend:check

      - name: Build the APK
        id: apk
        shell: bash
        working-directory: ${{ env.SHELL_DIR }}/android
        env:
          TVSHELL_KEYSTORE_B64: ${{ secrets.TVSHELL_KEYSTORE_B64 }}
          TVSHELL_KEYSTORE_PASSWORD: ${{ secrets.TVSHELL_KEYSTORE_PASSWORD }}
          TVSHELL_KEY_ALIAS: ${{ secrets.TVSHELL_KEY_ALIAS }}
          TVSHELL_KEY_PASSWORD: ${{ secrets.TVSHELL_KEY_PASSWORD }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # versionCode: commit time in minutes, monotonic across forks and upstream.
          TVSHELL_VERSION_CODE=$(( $(git log -1 --format=%ct HEAD) / 60 ))
          export TVSHELL_VERSION_CODE
          SIGNER=debug
          if [ -n "${TVSHELL_KEYSTORE_B64:-}" ]; then
            echo "$TVSHELL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvshell.keystore"
            export TVSHELL_KEYSTORE_PATH="$RUNNER_TEMP/tvshell.keystore"
            SIGNER=release
          fi
          # Always a release (non-debuggable) build; without the secrets it is
          # signed with the versioned debug key (see app/build.gradle).
          ./gradlew --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          OUT="natortv-${VERSION}-${HEAD_SHA::7}.apk"
          mkdir -p ../../dist && cp "$APK" "../../dist/$OUT"
          echo "APK $OUT: versionCode $TVSHELL_VERSION_CODE, signed with the $SIGNER key"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: dist

      - name: Publish a GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          APK_VERSION: ${{ needs.build.outputs.apk_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="natortv-v${APK_VERSION}-${GITHUB_RUN_NUMBER}"
          # Pre-release and never Latest unless the dispatcher unticked `prerelease`
          # (a fork publishing for its own users); GitHub then applies its usual
          # Latest rule to the normal release.
          FLAGS=(--prerelease --latest=false)
          if [ "$PRERELEASE" != "true" ]; then FLAGS=(); fi
          gh release create "$TAG" "dist/${APK_NAME}" \
            --target "$GITHUB_SHA" \
            "${FLAGS[@]}" \
            --title "NatorTV ${APK_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "NatorTV: experimental Fire TV / Android TV app based on IPTVnator (not the official IPTVnator). Install with the Downloader app (APK link below) or with \`adb install -r\`. Unless the repository provides a release key, the APK is signed with the versioned debug key (tv-shell/android/app/debug.keystore), so newer builds install over older ones. See tv-shell/README.md."
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
