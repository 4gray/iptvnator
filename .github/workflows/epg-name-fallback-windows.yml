name: Fork EPG Fix - Windows installer

on:
    push:
        branches:
            - fix/epg-exact-name-fallback
            - feat/m3u-content-classification
            - feat/epg-configurable-match-priority
            - fix/xtream-epg-visible-list-initial-refresh
            - feat/epg-duplicate-coverage-and-fork-readme
            - fix/m3u-epg-alias-reactive-refresh
            - feat/epg-first-exact-match
            - fix/m3u-epg-per-channel-exact
            - feat/m3u-poster-catalog-season-browser
            - feat/m3u-classification-playback-resilience
            - feat/catalog-5-user-acceptance-fixes
    workflow_dispatch:

concurrency:
    group: fork-epg-fix-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    windows-installer:
        name: EPG tests and Windows x64 EXE
        runs-on: windows-2022
        timeout-minutes: 90
        env:
            CI: 'true'
            CSC_IDENTITY_AUTO_DISCOVERY: 'false'
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: win32
            IPTVNATOR_EMBEDDED_MPV_ARCH: x64
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
        steps:
            - name: Checkout fork branch
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Test shared EPG matching utilities
              run: pnpm nx test shared-interfaces --runInBand --skip-nx-cache

            - name: Test automatic EPG settings
              run: pnpm nx test web --runInBand --skip-nx-cache --runTestsByPath apps/web/src/app/settings/settings-epg-section.component.spec.ts apps/web/src/app/settings/settings-form.utils.spec.ts

            - name: Test settings matching preferences
              run: pnpm nx test web --runInBand --skip-nx-cache --runTestsByPath apps/web/src/app/settings/settings-epg-section.component.spec.ts apps/web/src/app/settings/settings-form.utils.spec.ts

            - name: Test exact-name fallback
              run: pnpm nx test m3u-state --runInBand --skip-nx-cache

            - name: Test Xtream EPG fallback
              run: pnpm nx test portal-xtream-data-access --runInBand --skip-nx-cache

            - name: Test Xtream live list and first EPG paint
              run: pnpm nx test portal-xtream-feature --runInBand --skip-nx-cache

            - name: Test M3U classification
              run: pnpm nx test m3u-utils --runInBand --skip-nx-cache

            - name: Test playback MIME routing and web engines
              run: pnpm nx test ui-playback --skip-nx-cache

            - name: Test shared playlist DB persistence and migrations
              run: pnpm nx test database --runInBand --skip-nx-cache

            - name: Test Electron lightweight playlist metadata reads
              run: pnpm exec jest --config apps/electron-backend/jest.config.ts --runInBand --runTestsByPath apps/electron-backend/src/app/database/operations/playlist.operations.spec.ts

            - name: Test M3U channel list and context menus
              run: pnpm nx test components --skip-nx-cache

            - name: Test workspace header and navigation
              run: pnpm nx test workspace-shell-feature --runInBand --skip-nx-cache

            - name: Test M3U routes and player
              run: pnpm nx test playlist-m3u-feature-player --skip-nx-cache

            - name: Test global EPG resolution and Recently Viewed persistence
              run: pnpm nx test portal-shared-data-access --runInBand --skip-nx-cache

            - name: Test Recently Viewed movie/series navigation
              run: pnpm nx test portal-shared-ui --runInBand --skip-nx-cache

            - name: Test settings storage round trips
              run: pnpm nx test services --runInBand --skip-nx-cache --runTestsByPath libs/services/src/lib/settings-store.service.spec.ts

            - name: Test shared portal navigation
              run: pnpm nx test portal-shared-util --runInBand --skip-nx-cache

            - name: Test M3U store lookup and EPG stale-response protection
              run: pnpm nx test m3u-state --runInBand --skip-nx-cache && pnpm nx test epg-data-access --runInBand --skip-nx-cache

            - name: Test large M3U manual mapping batches
              run: pnpm exec jest --config apps/electron-backend/jest.config.ts --runInBand --runTestsByPath apps/electron-backend/src/app/database/operations/epg-mapping.operations.spec.ts

            - name: Type-check desktop and renderer
              run: pnpm run typecheck:ci

            - name: Resolve pinned embedded MPV runtime
              id: mpv
              shell: bash
              run: node tools/embedded-mpv/windows-runtime-pin.mjs --github-output

            - name: Stage verified embedded MPV runtime
              shell: bash
              env:
                  WINDOWS_RUNTIME_URL: ${{ steps.mpv.outputs.url }}
                  WINDOWS_RUNTIME_SHA256: ${{ steps.mpv.outputs.sha256 }}
              run: |
                  set -euo pipefail
                  pnpm embedded-mpv:stage-runtime:windows-archive -- "${WINDOWS_RUNTIME_URL}" "${WINDOWS_RUNTIME_SHA256}"

            - name: Restrict electron-builder to Windows x64
              shell: bash
              run: |
                  node - <<'NODE'
                  const fs = require('fs');
                  const config = JSON.parse(fs.readFileSync('electron-builder.json', 'utf8'));
                  for (const target of config.win.target) target.arch = ['x64'];
                  fs.writeFileSync('electron-builder.json', JSON.stringify(config, null, 4) + '\n');
                  NODE

            - name: Build Windows installer (not published)
              run: pnpm run make:app

            - name: Upload unsigned Windows installer
              uses: actions/upload-artifact@v7
              with:
                  name: IPTVnator-M3U-Catalog-v0.25.0-catalog.6-Windows-x64
                  path: dist/executables/**/*windows-x64-setup.exe
                  if-no-files-found: error
                  retention-days: 14
