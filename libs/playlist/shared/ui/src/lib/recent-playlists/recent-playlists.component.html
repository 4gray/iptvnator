@if (playlists().length === 0) {
    @if (allPlaylistsLoaded()) {
        <app-empty-state
            [type]="'welcome-sources'"
            [showElectronOnlyValueProps]="isElectron"
            (addPlaylistClicked)="onAddPlaylist($event)"
        />
    }
} @else if (visiblePlaylists().length === 0) {
    <div class="sources-empty no-results-state" role="status">
        <p class="sources-empty__message">
            {{ 'WORKSPACE.SOURCES.NO_MATCHES' | translate }}
        </p>
        @if (hasFilters()) {
            <button
                mat-button
                type="button"
                class="sources-empty__reset"
                (click)="resetFilters()"
            >
                <mat-icon>filter_alt_off</mat-icon>
                {{ 'WORKSPACE.SOURCES.RESET_FILTERS' | translate }}
            </button>
        }
    </div>
} @else {
    <div
        class="sources-list"
        cdkDropList
        [cdkDropListDisabled]="!isCustomSort()"
        (cdkDropListDropped)="drop($event)"
    >
        @for (item of visiblePlaylists(); track item._id) {
            <app-source-row
                [playlist]="item"
                [current]="activePlaylistId() === item._id"
                [draggable]="isCustomSort()"
                [canRefresh]="canRefresh(item)"
                [refreshing]="isRefreshing(item)"
                [removable]="isRemovable(item)"
                [deleting]="removal.progress.isDeleting(item._id)"
                [busyMessage]="busyMessage(item)"
                [busyProgress]="busyProgress(item)"
                [canCancelBusy]="canCancelBusy(item)"
                (activated)="open(item)"
                (refreshRequested)="refresh.refresh(item)"
                (editRequested)="edit(item)"
                (removeRequested)="remove(item)"
                (cancelBusyRequested)="cancelBusy(item)"
            />
        }
    </div>
}
