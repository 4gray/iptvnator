<app-state-view
    [variant]="variant()"
    [heading]="title() ?? ''"
    [description]="description()"
    [retryable]="retryable()"
    [actionLabel]="
        showActionButtons()
            ? ('PORTALS.ERROR_VIEW.PLAYLIST_SETTINGS' | translate)
            : null
    "
    actionIcon="settings"
    (retry)="retry.emit()"
    (action)="openPlaylistDetails()"
>
    @if (showActionButtons()) {
        <div class="error-view__links">
            <button
                mat-button
                type="button"
                class="error-view__link"
                routerLink="/"
            >
                <mat-icon aria-hidden="true">home</mat-icon>
                {{ 'PORTALS.ERROR_VIEW.HOME' | translate }}
            </button>
            <button
                mat-button
                type="button"
                class="error-view__link app-destructive-button"
                (click)="removeClicked()"
            >
                <mat-icon aria-hidden="true">delete</mat-icon>
                {{ 'PORTALS.ERROR_VIEW.DELETE' | translate }}
            </button>
        </div>
    }
</app-state-view>
