<div class="empty-state-container">
    <mat-icon class="empty-state-icon">{{ icon() }}</mat-icon>
    <h2 class="empty-state-title">{{ message() }}</h2>
    @if (hint(); as hint) {
        <p class="empty-state-hint">{{ hint }}</p>
    }
    @if (actionLabel(); as label) {
        <button
            type="button"
            mat-stroked-button
            class="empty-state-action"
            (click)="action.emit()"
        >
            @if (actionIcon(); as actionIcon) {
                <mat-icon>{{ actionIcon }}</mat-icon>
            }
            {{ label }}
        </button>
    }
</div>
