@if (items().length > 0) {
    <div class="nav-list" id="portal-categories">
        @for (item of items(); track $index) {
            <button
                type="button"
                class="nav-item category-item"
                (keydown)="focusLiveChannels($event)"
                [attr.data-category-id]="$any(item).category_id ?? item.id"
                [class.selected]="isSelected(item)"
                [class.category-item--selected]="isSelected(item)"
                [attr.aria-current]="isSelected(item) ? 'true' : null"
                (click)="categoryClicked.emit(item)"
            >
                <span class="nav-item-label">
                    @if (item.labelKey) {
                        {{ item.labelKey | translate }}
                    } @else {
                        {{
                            item.category_name ||
                                $any(item).name ||
                                ('PORTALS.UNNAMED_CATEGORY' | translate)
                        }}
                    }
                </span>
                @if (showCounts()) {
                    <div class="item-count app-count-badge">
                        {{ getItemCount(item) }}
                    </div>
                } @else if ($any(item).count !== undefined) {
                    <div class="item-count app-count-badge">
                        {{ $any(item).count }}
                    </div>
                }
            </button>
        } @empty {
            <app-state-view
                variant="no-results"
                size="panel"
                [heading]="'PORTALS.EMPTY_LIST_VIEW.TITLE' | translate"
                [description]="
                    'PORTALS.EMPTY_LIST_VIEW.NO_SEARCH_RESULTS' | translate
                "
            />
        }
    </div>
} @else {
    <app-state-view
        size="panel"
        icon="category"
        [heading]="'PORTALS.NO_CATEGORIES' | translate"
    />
}
