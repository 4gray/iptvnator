<app-dialog-shell
    icon="download_done"
    [heading]="group.title"
    [subtitle]="
        (episodeCountKey(currentMembers().length)
            | translate: { count: currentMembers().length }) +
        (group.sourceName.trim() ? ' · ' + group.sourceName : '')
    "
>
    <span appDialogHeaderEnd class="downloaded-series-dialog__eyebrow">
        {{ 'DOWNLOADS.DOWNLOADED_EPISODES' | translate }}
    </span>
    <ol class="downloaded-series-dialog__list">
        @for (member of currentMembers(); track member.id) {
            <li
                class="downloaded-series-dialog__episode"
                [attr.data-test-id]="'downloaded-series-episode-' + member.id"
                [attr.aria-busy]="isPending(member) ? 'true' : null"
            >
                <div class="downloaded-series-dialog__identity">
                    @if (episodeLabel(member); as label) {
                        <span class="downloaded-series-dialog__number">
                            {{ label }}
                        </span>
                    }
                    <span class="downloaded-series-dialog__title">
                        {{ member.title }}
                    </span>
                    <span class="downloaded-series-dialog__size">
                        {{ formatBytes(member.bytesDownloaded) }}
                    </span>
                </div>

                <div class="downloaded-series-dialog__actions">
                    <button
                        mat-icon-button
                        type="button"
                        [disabled]="isPending(member)"
                        [attr.aria-label]="
                            ('DOWNLOADS.PLAY' | translate) +
                            ': ' +
                            episodeIdentity(member)
                        "
                        [matTooltip]="'DOWNLOADS.PLAY' | translate"
                        (click)="emitAction('play', member)"
                    >
                        <mat-icon aria-hidden="true">play_arrow</mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        type="button"
                        [disabled]="isPending(member)"
                        [attr.aria-label]="
                            ('DOWNLOADS.REVEAL' | translate) +
                            ': ' +
                            episodeIdentity(member)
                        "
                        [matTooltip]="'DOWNLOADS.REVEAL' | translate"
                        (click)="emitAction('reveal', member)"
                    >
                        <mat-icon aria-hidden="true">folder_open</mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        type="button"
                        [disabled]="isPending(member)"
                        [attr.aria-label]="
                            ('DOWNLOADS.COPY_URL' | translate) +
                            ': ' +
                            episodeIdentity(member)
                        "
                        [matTooltip]="'DOWNLOADS.COPY_URL' | translate"
                        (click)="emitAction('copy-url', member)"
                    >
                        <mat-icon aria-hidden="true">content_copy</mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        type="button"
                        [disabled]="isPending(member)"
                        [attr.aria-label]="
                            ('DOWNLOADS.REMOVE_FROM_MANAGER' | translate) +
                            ': ' +
                            episodeIdentity(member)
                        "
                        [matTooltip]="
                            'DOWNLOADS.REMOVE_FROM_MANAGER' | translate
                        "
                        (click)="emitAction('remove', member)"
                    >
                        <mat-icon aria-hidden="true">
                            remove_circle_outline
                        </mat-icon>
                    </button>
                </div>
            </li>
        }
    </ol>
</app-dialog-shell>
