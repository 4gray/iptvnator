<app-channel-list-container
    [channelList]="channels()"
    [managementChannels]="managementChannels()"
    [emptyHint]="emptyHint()"
    [channelsLoading]="channelsLoading()"
    [activeView]="activeView()"
    [recentItems]="activePlaylist()?.recentlyViewed ?? []"
    [sidebarWidth]="sidebarWidth()"
    (sidebarWidthRequested)="onSidebarWidthRequested($event)"
    (sidebarWidthRequestEnded)="onSidebarWidthRequestEnded($event)"
    (sidebarToggleRequested)="sidebarToggleRequested.emit()"
    (selectedGroupChange)="selectedGroupChange.emit($event)"
/>
