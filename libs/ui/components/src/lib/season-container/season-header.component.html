<div class="section-header">
    <div class="section-header__left">
        <h3 class="section-title">
            {{ 'PORTALS.SEASONS_AND_EPISODES' | translate }}
        </h3>
    </div>
    @if (
        downloadVisible() ||
        watchToggleVisible() ||
        viewToggleVisible() ||
        seriesMenuVisible()
    ) {
        <div class="section-header__actions">
            @if (watchToggleVisible()) {
                <button
                    mat-stroked-button
                    class="season-watch-toggle-button"
                    data-test-id="toggle-season-watched"
                    [disabled]="
                        watchBatchRunning() ||
                        (!seasonFullyWatched() && watchEligibleCount() === 0)
                    "
                    [attr.aria-label]="
                        (seasonFullyWatched()
                            ? 'XTREAM.MARK_SEASON_UNWATCHED'
                            : 'XTREAM.MARK_SEASON_WATCHED'
                        ) | translate: { count: watchEligibleCount() }
                    "
                    [attr.aria-busy]="watchBatchRunning() ? 'true' : null"
                    (click)="toggleSeasonWatched.emit()"
                >
                    @if (watchBatchRunning()) {
                        <mat-spinner
                            diameter="18"
                            aria-hidden="true"
                        ></mat-spinner>
                    } @else {
                        <mat-icon>{{
                            seasonFullyWatched() ? 'remove_done' : 'done_all'
                        }}</mat-icon>
                    }
                    <span class="season-watch-toggle-button__label">
                        {{
                            (seasonFullyWatched()
                                ? 'XTREAM.MARK_SEASON_UNWATCHED'
                                : 'XTREAM.MARK_SEASON_WATCHED'
                            ) | translate: { count: watchEligibleCount() }
                        }}
                    </span>
                </button>
            }
            @if (downloadVisible()) {
                <button
                    mat-stroked-button
                    class="season-download-button"
                    data-test-id="download-season"
                    [disabled]="seasonDisabled()"
                    [attr.aria-label]="
                        batchRunning()
                            ? ('DOWNLOADS.ADDING_TO_QUEUE' | translate)
                            : ('DOWNLOADS.DOWNLOAD_SEASON_ARIA'
                              | translate: { count: eligibleEpisodeCount() })
                    "
                    [attr.aria-busy]="batchRunning() ? 'true' : null"
                    (click)="downloadSeason.emit()"
                >
                    @if (batchRunning()) {
                        <mat-spinner
                            diameter="18"
                            aria-hidden="true"
                        ></mat-spinner>
                    } @else {
                        <mat-icon>download</mat-icon>
                    }
                    <span class="season-download-button__label">
                        @if (batchRunning()) {
                            {{ 'DOWNLOADS.ADDING_TO_QUEUE' | translate }}
                        } @else {
                            {{
                                'DOWNLOADS.DOWNLOAD_SEASON'
                                    | translate
                                        : { count: eligibleEpisodeCount() }
                            }}
                        }
                    </span>
                </button>
            }
            @if (viewToggleVisible()) {
                <div class="view-toggle">
                    <mat-button-toggle-group
                        [value]="viewMode()"
                        (change)="viewModeChange.emit($event.value)"
                        hideSingleSelectionIndicator
                    >
                        <mat-button-toggle
                            value="grid"
                            [aria-label]="'PORTALS.GRID_VIEW' | translate"
                            [matTooltip]="'PORTALS.GRID_VIEW' | translate"
                        >
                            <mat-icon>grid_view</mat-icon>
                        </mat-button-toggle>
                        <mat-button-toggle
                            value="list"
                            [aria-label]="'PORTALS.LIST_VIEW' | translate"
                            [matTooltip]="'PORTALS.LIST_VIEW' | translate"
                        >
                            <mat-icon>view_list</mat-icon>
                        </mat-button-toggle>
                    </mat-button-toggle-group>
                </div>
            }
            @if (seriesMenuVisible()) {
                <button
                    mat-icon-button
                    class="series-watch-menu-trigger"
                    data-test-id="series-watch-menu"
                    [matMenuTriggerFor]="seriesWatchMenu"
                    [attr.aria-label]="'XTREAM.SERIES_WATCH_MENU' | translate"
                >
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #seriesWatchMenu="matMenu">
                    <button
                        mat-menu-item
                        class="series-watch-menu-item"
                        data-test-id="toggle-series-watched"
                        [disabled]="seriesActionDisabled()"
                        [attr.aria-busy]="watchBatchRunning() ? 'true' : null"
                        (click)="toggleSeriesWatched.emit()"
                    >
                        @if (watchBatchRunning()) {
                            <mat-spinner
                                diameter="18"
                                aria-hidden="true"
                            ></mat-spinner>
                        } @else {
                            <mat-icon>{{
                                seriesFullyWatched()
                                    ? 'remove_done'
                                    : 'done_all'
                            }}</mat-icon>
                        }
                        <span>
                            {{
                                seriesActionLabelKey()
                                    | translate
                                        : { count: seriesEligibleCount() }
                            }}
                        </span>
                    </button>
                </mat-menu>
            }
        </div>
    }
</div>
