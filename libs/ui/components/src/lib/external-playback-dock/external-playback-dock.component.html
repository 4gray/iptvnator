<section
    class="external-playback-dock"
    [class.external-playback-dock--compact]="compact()"
    [class.external-playback-dock--error]="session().status === 'error'"
    [attr.aria-busy]="session().status === 'launching' ? 'true' : null"
>
    <button
        type="button"
        class="external-playback-dock__artwork"
        [class.external-playback-dock__artwork--interactive]="
            artworkInteractive()
        "
        [disabled]="!artworkInteractive()"
        [attr.aria-label]="artworkInteractive() ? 'Open in playlist' : null"
        (click)="onArtworkClick()"
    >
        @if (showArtwork()) {
            <img
                [src]="artworkUrl()"
                [alt]="session().title"
                loading="lazy"
                (error)="onArtworkError()"
            />
        } @else {
            <div class="external-playback-dock__placeholder">
                <mat-icon>{{ artworkPlaceholderIcon() }}</mat-icon>
            </div>
        }
    </button>

    <div class="external-playback-dock__meta">
        <div class="external-playback-dock__title">{{ displayTitle() }}</div>
        <div class="external-playback-dock__status" aria-live="polite">
            <span class="external-playback-dock__chip">{{
                playerLabel()
            }}</span>
            <span
                class="external-playback-dock__status-separator"
                aria-hidden="true"
                >·</span
            >
            @if (showSpinner()) {
                <mat-spinner
                    aria-hidden="true"
                    diameter="12"
                    strokeWidth="2"
                ></mat-spinner>
            } @else if (showStatusIcon()) {
                <mat-icon
                    aria-hidden="true"
                    class="external-playback-dock__status-icon"
                    >{{ statusIcon() }}</mat-icon
                >
            }
            <span class="external-playback-dock__status-text">
                @if (session().status === 'error' && session().error) {
                    {{ session().error }}
                } @else {
                    {{ statusLabelKey() | translate }}
                }
            </span>
        </div>
    </div>

    <div class="external-playback-dock__actions">
        @if (showActionButton()) {
            <button
                type="button"
                mat-button
                class="external-playback-dock__button"
                [attr.aria-label]="actionLabelKey() | translate"
                (click)="onActionClick()"
            >
                <mat-icon aria-hidden="true">{{ actionIcon() }}</mat-icon>
                @if (!compact()) {
                    <span>{{ actionLabelKey() | translate }}</span>
                }
            </button>
        }
    </div>
</section>
