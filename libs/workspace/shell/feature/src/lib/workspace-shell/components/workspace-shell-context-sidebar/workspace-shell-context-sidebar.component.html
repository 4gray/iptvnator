<!-- Phone-only (CSS-hidden above 640px): touch screen-reader users have no
     hardware Escape and cannot reach the inert header toggle or the
     aria-hidden backdrop, so the trapped drawer itself must always carry a
     dismiss control — even when a category list is loading or empty. -->
<div class="context-drawer-header">
    <button
        type="button"
        class="context-drawer-close"
        data-test-id="context-drawer-close"
        (click)="closeDrawer()"
        [attr.aria-label]="'CLOSE' | translate"
    >
        <mat-icon>close</mat-icon>
    </button>
</div>

@if (variant() === 'sources' && hasPlaylists()) {
    <aside
        tabindex="-1"
        cdkFocusInitial
        class="context-panel context-panel--sources"
        appResizable
        [minWidth]="220"
        [maxWidth]="440"
        [defaultWidth]="290"
        storageKey="sidebar-width"
    >
        <app-workspace-sources-filters-panel />
    </aside>
} @else if (variant() === 'category') {
    @if (context(); as context) {
        @if (section(); as section) {
            <aside
                tabindex="-1"
                cdkFocusInitial
                class="context-panel context-panel--route"
                [class.context-panel--collapsed]="isContextPanelCollapsed()"
                [attr.inert]="isContextPanelInert() ? '' : null"
                appResizable
                [minWidth]="240"
                [maxWidth]="560"
                [defaultWidth]="300"
                storageKey="sidebar-width"
            >
                <app-workspace-context-panel
                    #contextPanel
                    [context]="context"
                    [section]="section"
                />
            </aside>
        }
    }
} @else if (variant() === 'settings') {
    <aside
        tabindex="-1"
        cdkFocusInitial
        class="context-panel context-panel--settings"
        appResizable
        [minWidth]="200"
        [maxWidth]="400"
        [defaultWidth]="260"
        storageKey="sidebar-width"
    >
        <app-workspace-settings-context-panel />
    </aside>
} @else if (variant() === 'collection') {
    <aside
        tabindex="-1"
        cdkFocusInitial
        class="context-panel context-panel--route"
        appResizable
        [minWidth]="200"
        [maxWidth]="400"
        [defaultWidth]="260"
        storageKey="sidebar-width"
    >
        <app-workspace-collection-context-panel />
    </aside>
}
