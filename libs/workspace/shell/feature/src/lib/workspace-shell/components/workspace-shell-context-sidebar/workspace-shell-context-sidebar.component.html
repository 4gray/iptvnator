@if (variant() === 'sources' && hasPlaylists()) {
    <aside
        class="context-panel context-panel--sources"
        appResizable
        [minWidth]="220"
        [maxWidth]="440"
        [defaultWidth]="290"
        storageKey="sidebar-width"
    >
        <app-workspace-sources-filters-panel />
    </aside>
} @else if (variant() === 'category') {
    @if (context(); as context) {
        @if (section(); as section) {
            @if (canRestoreGroupsPanel()) {
                <button
                    type="button"
                    mat-icon-button
                    class="context-panel-restore"
                    data-testid="live-groups-panel-restore"
                    aria-controls="live-groups-panel"
                    aria-expanded="false"
                    [attr.aria-label]="'LAYOUT.SHOW_GROUPS_PANEL' | translate"
                    [matTooltip]="'LAYOUT.SHOW_GROUPS_PANEL' | translate"
                    (click)="onGroupsPanelExpandedChange(true)"
                >
                    <mat-icon>chevron_right</mat-icon>
                </button>
            }
            <aside
                id="live-groups-panel"
                class="context-panel context-panel--route"
                [class.context-panel--collapsed]="!groupsPanelExpanded()"
                [attr.aria-hidden]="!groupsPanelExpanded()"
                [attr.inert]="groupsPanelExpanded() ? null : ''"
                appResizable
                [minWidth]="240"
                [maxWidth]="560"
                [defaultWidth]="300"
                storageKey="sidebar-width"
            >
                <app-workspace-context-panel
                    [context]="context"
                    [section]="section"
                    [groupsPanelExpanded]="groupsPanelExpanded()"
                    (groupsPanelExpandedChange)="
                        onGroupsPanelExpandedChange($event)
                    "
                />
            </aside>
        }
    }
} @else if (variant() === 'settings') {
    <aside
        class="context-panel context-panel--settings"
        appResizable
        [minWidth]="200"
        [maxWidth]="400"
        [defaultWidth]="260"
        storageKey="sidebar-width"
    >
        <app-workspace-settings-context-panel />
    </aside>
} @else if (variant() === 'collection') {
    <aside
        class="context-panel context-panel--route"
        appResizable
        [minWidth]="200"
        [maxWidth]="400"
        [defaultWidth]="260"
        storageKey="sidebar-width"
    >
        <app-workspace-collection-context-panel />
    </aside>
}
