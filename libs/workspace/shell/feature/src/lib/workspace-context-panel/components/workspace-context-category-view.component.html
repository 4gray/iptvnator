@if (items().length > 0) {
    <div
        class="nav-list"
        [attr.id]="columnHandoff() ? 'portal-categories' : null"
    >
        @if (statusText()) {
            <div class="context-inline-status">
                {{ statusText() }}
            </div>
        }
        @for (item of items(); track $index) {
            <button
                type="button"
                class="nav-item category-item"
                (keydown)="onCategoryKeydown($event)"
                [attr.data-category-id]="
                    $any(item).category_id ?? $any(item).xtream_id ?? item.id
                "
                [class.selected]="isSelected(item)"
                [class.category-item--selected]="isSelected(item)"
                [class.category-item--disabled]="!interactionEnabled()"
                [attr.aria-current]="isSelected(item) ? 'true' : null"
                [attr.aria-disabled]="!interactionEnabled()"
                [disabled]="!interactionEnabled()"
                (click)="onCategoryClick(item)"
                (contextmenu)="onCategoryContextMenu(item, $event)"
            >
                <span class="nav-item-label">
                    @if (item.labelKey) {
                        {{ item.labelKey | translate }}
                    } @else {
                        {{
                            item.category_name ||
                                $any(item).name ||
                                ('PORTALS.UNNAMED_CATEGORY' | translate)
                        }}
                    }
                </span>
                @if (showCounts()) {
                    @if (countDisplayMode() === 'loading') {
                        <div
                            class="item-count item-count--loading"
                            aria-hidden="true"
                        ></div>
                    } @else if (hasItemCount(item)) {
                        <div class="item-count app-count-badge">
                            {{ getItemCount(item) }}
                        </div>
                    }
                } @else if ($any(item).count !== undefined) {
                    <div class="item-count app-count-badge">
                        {{ $any(item).count }}
                    </div>
                }
            </button>
        } @empty {
            <app-state-view
                variant="no-results"
                size="panel"
                [heading]="'PORTALS.EMPTY_LIST_VIEW.TITLE' | translate"
                [description]="
                    'PORTALS.EMPTY_LIST_VIEW.NO_SEARCH_RESULTS' | translate
                "
            />
        }
    </div>
} @else {
    <app-state-view
        class="category-empty-state"
        size="panel"
        icon="category"
        [heading]="'PORTALS.NO_CATEGORIES' | translate"
    />
}
