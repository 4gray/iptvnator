plugins {
    id 'com.android.application'
}

android {
    namespace 'org.tvshell.iptvnator'
    compileSdk 35

    defaultConfig {
        applicationId 'org.tvshell.iptvnator'
        minSdk 25          // Fire OS 6 (Android 7.1) and newer
        targetSdk 35
        // CI derives this from the commit time (minutes since the epoch) so every published
        // APK upgrades the previous one, whichever repository built it. Local builds: 1.
        versionCode = Integer.parseInt(System.getenv('TVSHELL_VERSION_CODE') ?: '1')
        versionName '0.1.0'
    }

    // Optional release signing: set the four TVSHELL_* environment variables
    // (the GitHub workflow fills them from repository secrets). Without them
    // the release build is signed with the versioned debug key: still a
    // non-debuggable APK, and it installs over earlier builds (same signer).
    def keystorePath = System.getenv('TVSHELL_KEYSTORE_PATH')
    def hasReleaseKeystore = keystorePath != null && file(keystorePath).exists()
    signingConfigs {
        // The versioned debug key (conventional, not secret) replaces the
        // auto-generated one: CI runners are ephemeral, and a different signer
        // on every build would make Android refuse to install a new APK over
        // the previous one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('TVSHELL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVSHELL_KEY_ALIAS')
                keyPassword System.getenv('TVSHELL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // The Angular bundle is copied to src/main/assets/www by the build
    // workflow (or by hand); keep it uncompressed so it is served straight
    // from the APK without extraction overhead.
    androidResources {
        noCompress 'js', 'css', 'json', 'woff', 'woff2', 'html', 'webmanifest', 'svg'
    }
}

dependencies {
    implementation project(':backend')
    // Last published NanoHTTPD. Known advisories do not apply: CVE-2020-13697 is in
    // RouterNanoHTTPD (nanolets, not used); CVE-2022-21230 concerns temp files in a shared
    // java.io.tmpdir, which on Android is the app-private cache dir. Request bodies are
    // capped in TvShellServer before NanoHTTPD parses them.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
