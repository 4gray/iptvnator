map $http_origin $tv_library_origin {
    default "";
    "file://com.iptvnator.tv.prototype-webos" $http_origin;
    "null" $http_origin;
    "${TV_WEB_ORIGIN}" $http_origin;
}
server {
    listen 80;
    server_name localhost;
    # Provider query strings can contain account data. Never log request URLs.
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:${PORT}/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }
    # One explicitly configured server, not a general URL forwarding endpoint.
    # Existing backend authentication is passed through unchanged.
    location /library/v1/ {
        proxy_pass ${LIBRARY_UPSTREAM}/v1/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Access-Control-Allow-Origin $tv_library_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, If-None-Match" always;
        if ($request_method = OPTIONS) { return 204; }
        # TV currently reads sources and explicitly creates missing ones only.
        limit_except GET PUT OPTIONS { deny all; }
    }
    location / { return 404; }
}
