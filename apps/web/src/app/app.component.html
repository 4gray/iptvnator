@if (!isElectron) {
    <app-source-sync-status />
}
<div class="app-viewport">
    <app-startup-status #startup [routeReady]="routeReady()" />
    <div class="app-route" [hidden]="!startup.complete()">
        <router-outlet (activate)="routeReady.set(true)" />
    </div>
</div>
@if (isElectron) {
    <app-source-sync-status />
}

<app-epg-progress-panel />

<app-update-notification-panel />

@if (usesCustomWindowControls) {
    <app-window-controls />
}
