<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>IPTVnator Picture in Picture</title>
        <link rel="stylesheet" href="overlay.css" />
        <script src="overlay.js" defer></script>
    </head>
    <body>
        <header id="drag-handle">
            <span>IPTVnator</span>
            <nav aria-label="Window controls">
                <button id="minimize" title="Minimize" aria-label="Minimize">
                    −
                </button>
                <button
                    id="restore"
                    title="Return to app"
                    aria-label="Return to app"
                >
                    ▣
                </button>
                <button
                    id="close"
                    title="Close floating window and return to app"
                    aria-label="Close floating window and return to app"
                >
                    ×
                </button>
            </nav>
        </header>
        <main aria-label="Playback controls">
            <button
                id="back"
                class="skip"
                title="Back 10 seconds"
                aria-label="Back 10 seconds"
                hidden
            >
                ↶<small>10</small>
            </button>
            <button id="pause" title="Play / pause" aria-label="Play / pause">
                ▶
            </button>
            <button
                id="forward"
                class="skip"
                title="Forward 10 seconds"
                aria-label="Forward 10 seconds"
                hidden
            >
                ↷<small>10</small>
            </button>
        </main>
        <footer>
            <input
                id="timeline"
                aria-label="Playback position"
                type="range"
                min="0"
                max="1"
                step="0.1"
                hidden
            />
            <div class="bottom-row">
                <output id="time" aria-live="off">Loading</output>
                <label aria-label="Volume"
                    >♫<input
                        id="volume"
                        aria-label="Volume"
                        type="range"
                        min="0"
                        max="100"
                        value="100"
                /></label>
            </div>
        </footer>
    </body>
</html>
