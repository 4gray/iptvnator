<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>IPTVnator Picture in Picture</title>
        <link rel="stylesheet" href="style.css" />
        <script src="controls.js" defer></script>
    </head>
    <body>
        <footer aria-label="Playback controls">
            <button id="pause" type="button">Play / pause</button>
            <label
                >Volume
                <input id="volume" type="range" min="0" max="100" value="100"
            /></label>
            <button id="restore" type="button">Return to app</button>
        </footer>
    </body>
</html>
